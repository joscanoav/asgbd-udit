# PLANTILLA SIN PROBAR. Pensada para el servidor del equipo (Ubuntu + Docker).
# No es requisito del Reto 4: se probará cuando exista ese servidor, con el profesor.
services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - backend
    # No hay "ports": la base de datos NO se publica; solo la usan los otros contenedores.

volumes:
  db_data:

networks:
  backend:
